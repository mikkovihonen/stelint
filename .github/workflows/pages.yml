name: Publish GitHub Pages

on:
  # Deliberately not triggered by `push`. Publishing runs only after CI passes
  # on main, which gates the docs on a green build and picks up the coverage
  # badge CI commits — that commit is pushed with GITHUB_TOKEN, so it does not
  # trigger workflows on its own.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Never publish docs off a failed CI run. On workflow_run the checkout
    # defaults to the head of the default branch, which is what we want here:
    # it includes the badge commit CI just made, whereas the SHA that triggered
    # CI predates it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync project environment
        run: uv sync

      - name: Build docs site
        run: uv run python -m zensical build

      - name: Fix asset paths
        run: uv run python scripts/post_build.py site

      - name: Verify build output
        run: |
          if [ ! -d "site" ] || [ -z "$(ls -A site 2>/dev/null)" ]; then
            echo "Error: 'site/' directory is missing or empty after build." >&2
            exit 1
          fi
          echo "Build output verified: $(find site -type f | wc -l) files found."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
