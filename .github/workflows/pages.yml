name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync project environment
        run: uv sync

      - name: Build docs site
        run: uv run python -m zensical build

      - name: Verify build output
        run: |
          if [ ! -d "site" ] || [ -z "$(ls -A site 2>/dev/null)" ]; then
            echo "Error: 'site/' directory is missing or empty after build." >&2
            exit 1
          fi
          echo "Build output verified: $(find site -type f | wc -l) files found."

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf .
          cp -R site/* .
          cp -R site/.* . 2>/dev/null || true
          touch .nojekyll
          git add .
          git commit -m "Publish Zensical site"
          git push --force origin gh-pages
