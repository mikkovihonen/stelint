[project]
name = "stelint"
version = "0.1.2"
description = "Stelint is an ASD-STE100 linter built with spaCy. It checks whether your text conforms to the Simplified Technical English (STE) specification and reports issues in Vale-compatible format."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stelint" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "spacy",
    "numpy",
    "beautifulsoup4",
    "nltk",
]

[project.scripts]
stelint = "stelint:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# Tests are run from a source checkout, so keep them out of the distributions.
source-exclude = ["**/tests/**", "**/.DS_Store"]
wheel-exclude = ["**/tests/**", "**/.DS_Store"]

[dependency-groups]
dev = [
    # spaCy English model, required by the checks and the test suite. Kept here
    # rather than in `dependencies` because PyPI rejects direct URL references.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "zensical",
    "build",
    "twine",
    "ruff",
    "pytest",
    "pytest-cov",
    "coverage",
    "pre-commit",
]

[tool.ruff]
target-version = "py313"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["src"]