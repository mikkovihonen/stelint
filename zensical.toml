[project]
site_url = "https://mikkovihonen.github.io/stelint/"
site_name = "Stelint"
repo_url = "https://github.com/mikkovihonen/stelint"
repo_name = "mikkovihonen/stelint"
copyright = "Copyright &copy; 2026 Mikko Vihonen. Licensed under MIT."
extra_css = ["assets/stylesheets/social-links.css"]
# `docs/index.md` is a symlink to the repo-root README.md, so the project
# homepage and the site homepage stay in sync from a single source.
nav = [
  { "Home" = "index.md" },
  { "Runbook" = "runbook.md" },
  { "Development" = "development.md" },
  { "Glossary file specification" = "glossary_file_specification.md" },
]

[project.theme]
custom_dir = "zensical"
language = "en"
features = [
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[project.extra]
generator = false

[[project.extra.social]]
icon = "simple/pypi"
link = "https://pypi.org/project/stelint/"
name = "PyPI"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
