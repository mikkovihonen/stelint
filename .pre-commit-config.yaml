repos:
  - repo: local
    hooks:
      - id: check-uv-lock
        name: Ensure uv.lock is present and tracked
        entry: .github/scripts/check_uv_lock.sh
        language: script
        pass_filenames: false
      - id: check-version-consistency
        name: Check version consistency across pyproject.toml, git tag, and CHANGELOG.md
        entry: python .github/scripts/check_version_consistency.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Run ruff
        entry: uv run ruff check .
        language: system
        files: '\.py$'
      - id: ruff-format
        name: Run ruff format check
        entry: uv run ruff format --check .
        language: system
        files: '\.py$'
      - id: pytest
        name: Run pytest
        entry: uv run pytest
        language: system
        files: 'src/.*test_.*\.py$'
